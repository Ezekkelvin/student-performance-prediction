<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Performance Prediction{% endblock %}</title>

    <meta
        name="description"
        content="Machine learning-based student performance prediction system."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='CSS/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="{{ url_for('home') }}" class="brand">
                <div class="brand-mark">SP</div>

                <div class="brand-text">
                    <span>Student Performance</span>
                    <small>Prediction System</small>
                </div>
            </a>

            <div class="nav-links">
                <a href="{{ url_for('home') }}"
                   class="{% if request.endpoint == 'home' %}active{% endif %}">
                    Home
                </a>

                <a href="{{ url_for('predict') }}"
                   class="{% if request.endpoint == 'predict' %}active{% endif %}">
                    Predict
                </a>

                <a href="{{ url_for('about') }}"
                   class="{% if request.endpoint == 'about' %}active{% endif %}">
                    About
                </a>
            </div>

            <a href="{{ url_for('predict') }}" class="nav-button">
                Make Prediction
            </a>

        </div>

    </nav>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="footer">

        <div class="footer-container">

            <div>
                <strong>Student Performance Prediction System</strong>
                <p>
                    A machine learning-based system for early academic
                    performance monitoring.
                </p>
            </div>

            <div class="footer-right">
                <span>Final Year Project</span>
                <span>Software Engineering</span>
            </div>

        </div>

    </footer>

</body>
</html>
